# Over ride what is in the configuration Admin service
OverRideConfigAdmin=true

# Set our port to use.
port=80

# No secure port defined but it would be like this
# ssl.port=8443

# Set ip address to bind to. For our test we are going to bind to all address
# so we don't define it. But you could do this:
# IPAddress=127.0.0.1

# Set the HostName we will respond to. For now we take anything but if we wanted
# to we could set it like so:
#HostName=localhost
